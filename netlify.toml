[build]
  publish = "dist/portale"
  command = "npm ci && SITE_KEY=portale npm run build:site"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_KEY,SUPABASE_SERVICE_ROLE_KEY,EMAIL_FROM,INTERNAL_API_KEY"

[functions]
  directory = "dist/portale/netlify/functions"

[functions."sync-beds24-links"]
  schedule = "0 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
