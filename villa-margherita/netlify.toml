[build]
  publish = "."

[[redirects]]
  from = "/backoffice.html"
  to = "https://fatture.illupoaffitta.com/backoffice.html"
  status = 302
  force = true

[[redirects]]
  from = "/backoffice-documenti.html"
  to = "https://fatture.illupoaffitta.com/backoffice-documenti.html"
  status = 302
  force = true

[[redirects]]
  from = "/backoffice-portale.html"
  to = "https://fatture.illupoaffitta.com/backoffice-portale.html"
  status = 302
  force = true

[[redirects]]
  from = "/backoffice-calendario.html"
  to = "https://fatture.illupoaffitta.com/backoffice-calendario.html"
  status = 302
  force = true

[[redirects]]
  from = "/"
  to = "https://fatture.illupoaffitta.com/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://fatture.illupoaffitta.com/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/portale.html"
  to = "https://fatture.illupoaffitta.com/portale.html"
  status = 302
  force = true

[[redirects]]
  from = "/carica-documenti-fattura.html"
  to = "https://fatture.illupoaffitta.com/carica-documenti-fattura.html"
  status = 302
  force = true

[[redirects]]
  from = "http://villamargheritarimini.it/*"
  to = "https://villamargheritarimini.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://villamargheritarimini.it/*"
  to = "https://villamargheritarimini.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.villamargheritarimini.it/*"
  to = "https://villamargheritarimini.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://residencevillamargherita.com/*"
  to = "https://villamargheritarimini.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
