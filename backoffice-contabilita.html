      <div class="field"><label>Indirizzo</label><input class="df" data-k="indirizzo_residenza" value="${esc(f.indirizzo_residenza)}"/></div>
    </div>
    <div class="drawer-sec">Dati fiscali</div>
    <div class="field-3">
      <div class="field"><label>Codice Fiscale</label>
        <input class="df" data-k="codice_fiscale" value="${esc(f.codice_fiscale)}" id="cfInput" style="${f.codice_fiscale_verificato?'border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.08)':''}"/>
      </div>
      <div class="field"><label>IVA %</label>
        <select class="df" data-k="iva_percentuale">${IVA_OPT.map(v=>`<option value="${v}"${String(f.iva_percentuale)===String(v)?' selected':''}>${v}%</option>`).join('')}</select>
      </div>
      <div class="field"><label>Tipo cliente</label>
        <select class="df" data-k="tipo_cliente">${TIPO_OPT.map(v=>`<option${f.tipo_cliente===v?' selected':''}>${v}</option>`).join('')}</select>
      </div>
    </div>
    <div class="chk-row">
      <input id="cfv" type="checkbox"${f.codice_fiscale_verificato?' checked':''}/>
      <label for="cfv">CF verificato</label>
    </div>
    ${isBiz?`
      <div class="field-2" style="margin-top:12px">
        <div class="field"><label>Ragione sociale</label><input class="df" data-k="ragione_sociale" value="${esc(f.ragione_sociale)}"/></div>
        <div class="field"><label>Partita IVA</label><input class="df" data-k="piva_cliente" value="${esc(f.piva_cliente)}"/></div>
      </div>
      <div class="field" style="margin-top:12px">
        <label>Indirizzo fatturazione</label>
        <input class="df" data-k="indirizzo_fatturazione" value="${esc(f.indirizzo_fatturazione||'')}"/>
      </div>
    `:''}
    <div class="drawer-sec">Soggiorno</div>
    <div class="field-2">
      <div class="field">
        <label>Stato pagamento fattura</label>
        <select class="df" data-k="payment_status">
          <option value="paid" ${f.payment_status==='paid'?'selected':''}>Già pagata</option>
          <option value="not_paid" ${f.payment_status==='not_paid'?'selected':''}>Da pagare</option>
        </select>
      </div>
      <div class="field">
        <label>Metodo incasso</label>
        <select class="df" data-k="payment_account_type">
          <option value="bonifico" ${f.payment_account_type==='bonifico'?'selected':''}>Bonifico</option>
          <option value="contanti" ${f.payment_account_type==='contanti'?'selected':''}>Contanti</option>
        </select>
      </div>
    </div>
    <div class="field-2">
      <div class="field">
        <label>Sezionale</label>
        <select class="df" data-k="sezionale">
          <option value="R" ${f.sezionale==='R'?'selected':''}>R · Residence</option>
          <option value="D" ${f.sezionale==='D'?'selected':''}>D · Diretti</option>
          <option value="P" ${f.sezionale==='P'?'selected':''}>P · Portali</option>
        </select>
      </div>
    </div>
    ${r.stato==='APPROVATA' ? `
      <div style="margin-top:12px;padding:11px 13px;border:1px solid var(--border);border-radius:6px;background:var(--surf);font-size:13px;line-height:1.55">
        <div><strong>Creazione FiC:</strong> verra usato il sezionale <strong>${esc(getSezionaleLabel(f.sezionale))}</strong></div>
        <div>Stato pagamento inviato: <strong>${esc(getPaymentStatusLabel(f.payment_status))}</strong></div>
      </div>
    ` : ''}
    <div class="field-2">
      <div class="field"><label>Importo lordo (€)</label><input class="df" type="number" step="0.01" data-k="importo_lordo" value="${esc(f.importo_lordo)}"/></div>
      <div class="field"><label>Data check-in</label><input class="df" type="date" data-k="data_checkin" value="${esc(f.data_checkin)}"/></div>
    </div>
    <div class="field-2">
      <div class="field"><label>Data check-out</label><input class="df" type="date" data-k="data_checkout" value="${esc(f.data_checkout)}"/></div>
      <div class="field">
        <label>Anteprima totale fattura</label>
        <div style="padding:11px 13px;border:1px solid var(--border);border-radius:6px;background:var(--surf);font-size:13px;line-height:1.55">
          <div>Imponibile: <strong>${formatCurrency(invoicePreview.imponibile)}</strong></div>
          <div>Bollo: <strong>${formatCurrency(invoicePreview.bollo)}</strong>${invoicePreview.bolloApplicato ? ' <span class="mono-sm" style="color:var(--yellow)">aggiunto in anteprima</span>' : ''}</div>
          <div>Totale documento: <strong>${formatCurrency(invoicePreview.totale)}</strong></div>
        </div>
      </div>
    </div>
    <div class="drawer-sec">Segnalazione</div>
    <div class="field"><textarea class="df" data-k="segnalazione_jessica" placeholder="Note o segnalazione…">${esc(f.segnalazione_jessica)}</textarea></div>
    <div class="drawer-sec">Stato corrente</div>
    <span class="badge ${badgeCls(r.stato)}" style="font-size:12px;padding:4px 12px">${badgeLbl(r.stato)}</span>
  </div>
  <div class="drawer-footer">
    <button id="dSave" class="btn btn-ghost" style="margin-right:auto">${S.saving?'<span class="spin"></span>':'💾'} Salva</button>
    ${isArchiveRow ? `
      <button id="dRestore" class="btn btn-yellow" ${S.saving?'disabled':''}>↺ Ripristina</button>
      <button id="dDelete" class="btn btn-red" ${S.saving?'disabled':''}>Elimina</button>
    ` : `
      <button id="dSegn" class="btn btn-yellow" ${S.saving?'disabled':''}>⚑ Segnala</button>
      <button id="dScar" class="btn btn-red" ${S.saving?'disabled':''}>✗ Scarta</button>
      <button id="dAppr" class="btn btn-green" ${S.saving?'disabled':''}>✓ Approva</button>
      ${r.stato==='APPROVATA'?`<button id="dFatt" class="btn btn-primary" ${S.saving?'disabled':''} style="background:#7c3aed">🧾 Fattura · ${esc(f.sezionale)}</button>`:''}
    `}
  </div>`;

  document.getElementById('dClose').addEventListener('click', ()=>{ S.selected=null; S.form={}; partialDrawer(); highlightSelected(); });
  document.getElementById('dSave').addEventListener('click', saveForm);
  document.getElementById('dAppr')?.addEventListener('click', ()=>setStato('APPROVATA'));
  document.getElementById('dScar')?.addEventListener('click', ()=>setStato('SCARTATA'));
  document.getElementById('dSegn')?.addEventListener('click', ()=>setStato('DA_VERIFICARE'));
  document.getElementById('dFatt')?.addEventListener('click', creaFattura);
  document.getElementById('dRestore')?.addEventListener('click', restoreSelected);
  document.getElementById('dDelete')?.addEventListener('click', deleteArchivedSelected);
  d.querySelectorAll('.df').forEach(el=>{
    el.addEventListener('input',  e=>{ S.form[e.target.dataset.k]=e.target.value; });
    el.addEventListener('change', e=>{
      S.form[e.target.dataset.k]=e.target.value;
      if (e.target.dataset.k==='tipo_cliente') {
        partialDrawer();
      } else if (['iva_percentuale','importo_lordo','payment_status','payment_account_type','sezionale'].includes(e.target.dataset.k)) {
        partialDrawer();
      }
    });
  });
  document.getElementById('cfv')?.addEventListener('change', e=>{
    S.form.codice_fiscale_verificato = e.target.checked;
    const inp = document.getElementById('cfInput');
    if (inp) { inp.style.borderColor=e.target.checked?'var(--green)':''; inp.style.boxShadow=e.target.checked?'0 0 0 3px rgba(22,163,74,.08)':''; }
  });
}

function updateFooter() {
  if (S.panelMode === 'contabilita') {
    if (S.accountingView === 'bollette') {
      const s=document.getElementById('dSaveBill'); if(!s) return;
      s.innerHTML = S.billSaving ? '<span class="spin"></span> Salvo…' : '💾 Salva';
      s.disabled = S.billSaving;
      ['dRejectBill','dApproveBill'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=S.billSaving; });
      return;
    }
    const s=document.getElementById('dSaveAcc'); if(!s) return;
    s.innerHTML = S.accountingSaving ? '<span class="spin"></span> Salvo…' : '💾 Salva';
    s.disabled = S.accountingSaving;
    ['dFixAcc','dRejectAcc','dApproveAcc'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=S.accountingSaving; });
    return;
  }
  const s=document.getElementById('dSave'); if(!s) return;
  s.innerHTML = S.saving ? '<span class="spin"></span> Salvo…' : '💾 Salva';
  s.disabled  = S.saving;
  ['dAppr','dScar','dSegn','dFatt','dRestore','dDelete'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=S.saving; });
}

function startInactivity() {
  const reset = () => {
    S.timeLeft = TIMEOUT_MS;
    clearTimeout(S.inTimer);
    S.inTimer = setTimeout(()=>sb.auth.signOut(), TIMEOUT_MS);
  };
  ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(e=>window.addEventListener(e,reset,{passive:true}));
  reset();
  clearInterval(S.cdTimer);
  S.cdTimer = setInterval(()=>{
    S.timeLeft = Math.max(0, S.timeLeft-1000);
    const pct=(S.timeLeft/TIMEOUT_MS)*100;
    const el=document.getElementById('tbar'); if(!el) return;
    el.style.width=pct+'%';
    el.style.background=pct<20?'#dc2626':pct<50?'#d97706':'#2563eb';
  }, 1000);
}

function withUiGuard(fn, context) {
  return async (...args) => {
    try {
      return await fn(...args);
    } catch (error) {
      console.error(`[backoffice-contabilita] ${context}:`, error);
      const message = error?.message || String(error || 'Errore inatteso');
      toast(`Errore ${context}: ${message}`, 'err');
      const app = document.getElementById('app');
      if (app && !app.innerHTML.trim()) {
        app.innerHTML = `<div class="login-wrap"><div class="login-card"><div class="login-logo">Impatto</div><div class="login-sub">Backoffice · Contabilita</div><div class="msg-err" style="display:block">Errore bloccante: ${esc(message)}</div></div></div>`;
      }
      return null;
    }
  };
}

window.addEventListener('error', (event) => {
  console.error('[backoffice-contabilita] window error:', event.error || event.message);
  toast('Errore pagina: ' + (event.error?.message || event.message || 'Errore sconosciuto'), 'err');
});

window.addEventListener('unhandledrejection', (event) => {
  console.error('[backoffice-contabilita] unhandled rejection:', event.reason);
  toast('Errore async: ' + (event.reason?.message || String(event.reason || 'Promise rifiutata')), 'err');
});

(withUiGuard(async()=>{
  const {data:{session}} = await sb.auth.getSession();
  if (session && isAllowedAccountingEmail(session.user?.email)) {
    S.session=session;
    renderDashboard();
    startInactivity();
    await loadData();
  } else {
    if (session) await sb.auth.signOut();
    renderLogin();
  }
}, 'init'))();

sb.auth.onAuthStateChange(async (_,session)=>{
  if (!session && S.session) {
    S.session=null;
    clearInterval(S.cdTimer); clearTimeout(S.inTimer);
    S.rows=[]; S.selected=null; S.form={};
    renderLogin();
  }
  if (session && !isAllowedAccountingEmail(session.user?.email)) {
    await sb.auth.signOut();
    S.session = null;
    renderLogin();
    const err = document.getElementById('lerr');
    if (err) {
      err.textContent = 'Questo pannello accetta solo account autorizzati per la contabilità.';
      err.style.display = 'block';
    }
    return;
  }
  if (session && !S.session) {
    S.session=session;
    renderDashboard(); startInactivity();
    try { await loadData(); } catch(e) { console.error('auth load error:', e); }
  }
});
</script>
</body>
</html>
